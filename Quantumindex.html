<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quantum Simulator</title>

    <!-- Load the p5.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>

    <style>
        #photonEnergyInput {
            width: 110px;
            padding: 12px;
            border: 1px solid #00dcff;
            border-radius: 8px;
            background: #17283d;
            color: #ebfaff;
            font-size: 15px;

        }

        body {
            margin: 0;
            padding: 25px;
            background: #0f1423;
            color: #ebf0fa;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            color: #00dcff;
            margin-bottom: 8px;
        }

        p {
            color: #b8c4d9;
        }

        #sketch-holder {
            margin: 20px auto 0;
            width: fit-content;
            max-width: 100%;
        }

        canvas {
            display: block;
            max-width: 100%;
            height: auto !important;
            border: 1px solid #263752;
            border-radius: 10px;
        }

        #controls {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin: 18px auto;
        }

        button {
            padding: 12px 18px;
            border: 1px solid #00dcff;
            border-radius: 8px;
            background: #17283d;
            color: #ebfaff;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #20425b;
        }

        button:focus-visible {
            outline: 2px solid white;
            outline-offset: 3px;
        }

        #status {
            min-height: 24px;
            color: #ffd166;
            line-height: 1.5;
        }

        .hint {
            font-size: 14px;
            line-height: 1.6;
        }
    </style>
</head>

<body>

    <h1>Terra Quantum Simulator</h1>

    <p>Explore Hydrogen Energy Levels</p>

    <!-- p5.js creates the simulation canvas inside this element -->
    <div id="sketch-holder"></div>
    <div id="transition-guide">
        <h2>Energy transition guide</h2>
        <p>Select a transition to explore it's photon energy</p>
        <label for="transitionSelect">Transition:</label>

        <select id="transitionSelect">
            <option value="1-2">n = 1 → n = 2</option>
            <option value="1-3">n = 1 → n = 3</option>
            <option value="2-3" selected>n = 2 → n = 3</option>
        </select>

        <p id="transitionInfo">
            Select a transitiom to see it's energy

        </p>
        <button id="usePhotonButton" type="button">
            Use This Photon
        </button>


    </div>
    <!-- Simulation controls -->
    <div id="controls">

        <button id="absorbButton" type="button">
            Absorb Energy ↑
        </button>

        <button id="emitButton" type="button">
            Emit Photon ↓
        </button>

        <label for="photonEnergyInput">
            Photon energy (eV):
        </label>

        <input id="photonEnergyInput" type="number" min="0" step="0.01" placeholder="e.g. 1.89">

        <button id="sendPhotonButton" type="button">
            Send Photon
        </button>
    </div>


    <!-- JavaScript updates this message -->
    <p id="status" aria-live="polite">
        Ready — electron is at n = 2.
    </p>

    <p class="hint">
        Keyboard controls: ↑ to absorb energy · ↓ to emit a photon
    </p>

    <!-- Load your simulation code after the HTML elements exist -->
    <script src="sketchquantum.js"></script>

</body>

</html>
